    .tile {
      background: #ffffff;
      color: #005ac2;
      width: 220px;
      height: 120px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(50, 50, 93, 0.07), 0 1.5px 3px rgba(0,0,0,0.04);
      transition: box-shadow 0.18s, transform 0.18s;
      cursor: pointer;
      user-select: none;
      text-decoration: none;
      border: 1px solid #dfe3e8;
      text-align: center;
      letter-spacing: 0.02em;
    }
    .tile:hover {
      box-shadow: 0 4px 16px rgba(50, 50, 93, 0.13), 0 3px 8px rgba(0,0,0,0.08);
      transform: translateY(-2px) scale(1.03);
      background: #f0f7ff;
      color: #003366;
      border-color: #b4d6fa;
    }
    .nav-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      z-index: 1300;
    }
    .hamburger {
      position: fixed;
      top: 18px;
      left: 18px;
      background: #fff;
      border: none;
      font-size: 2.4rem;
      color: #005ac2;
      cursor: pointer;
      z-index: 1301;
      padding: 10px 14px;
      border-radius: 8px;
      transition: color 0.15s, background 0.15s;
      box-shadow: 0 1px 4px rgba(50,50,93,0.07);
    }
    .hamburger:focus {
      outline: 2px solid #b4d6fa;
      background: #f0f7ff;
    }
    .side-menu {
      position: fixed;
      top: 0;
      left: -280px;
      width: 260px;
      height: 100vh;
      background: #fff;
      box-shadow: 2px 0 16px rgba(50,50,93,0.10);
      display: flex;
      flex-direction: column;
      padding: 32px 0 0 0;
      z-index: 1400;
      transition: left 0.22s cubic-bezier(.4,0,.2,1);
    }
    .side-menu.open {
      left: 0;
    }
    .side-menu a {
      color: #005ac2;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 18px 32px;
      border-radius: 0 20px 20px 0;
      transition: background 0.13s, color 0.13s;
    }
    .side-menu a:hover {
      background: #f0f7ff;
      color: #003366;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 2.2rem;
      color: #b4b4b4;
      align-self: flex-end;
      margin: 0 16px 16px 0;
      cursor: pointer;
      transition: color 0.15s;
      padding: 6px 12px;
      border-radius: 8px;
    }
    .close-btn:focus {
      outline: 2px solid #b4d6fa;
      background: #f0f7ff;
    }
    .close-btn:hover {
      color: #005ac2;
    }
    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.18);
      z-index: 1399;
    }
    .overlay.open {
      display: block;
    }
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #6b7280;
      font-size: 1.1rem;
    }
    @media (max-width: 900px) {
      .tiles {
        gap: 24px;
        max-width: 100%;
      }
      .tile {
        width: 100%;
        min-width: 180px;
        max-width: 340px;
        margin: 0 auto;
      }
    }
    @media (max-width: 600px) {
      .side-menu {
        width: 90vw;
        min-width: 0;
        max-width: 340px;
        left: -100vw;
        padding-top: 18vw;
      }
      .side-menu.open {
        left: 0;
      }
      .hamburger {
        top: 10px;
        left: 10px;
        font-size: 2.1rem;
        padding: 12px 16px;
      }
      .side-menu a {
        font-size: 1.15rem;
        padding: 18px 18px;
      }
      .close-btn {
        font-size: 2rem;
        margin: 0 10px 10px 0;
        padding: 8px 12px;
      }
      .tiles {
        flex-direction: column;
        gap: 18px;
        padding: 0 8px;
      }
      .tile {
        font-size: 1.1rem;
        height: 60vw;
        max-height: 140px;
      }
    }

  <script>
    // Check authentication
    if (sessionStorage.getItem('authenticated') !== 'true') {
      window.location.href = 'index.html';
    }

    // Decrypt and display content
    function decryptContent() {
      try {
        const encryptedData = document.getElementById('encryptedData').textContent.trim();
        const masterKey = sessionStorage.getItem('masterKey');
        
        if (!masterKey) {
          window.location.href = 'index.html';
          return;
        }

        // Decrypt the data
        const decrypted = CryptoJS.AES.decrypt(encryptedData, masterKey).toString(CryptoJS.enc.Utf8);
        
        if (!decrypted) {
          throw new Error('Decryption failed');
        }

        // Insert decrypted content
        document.getElementById('tilesContainer').innerHTML = decrypted;
      } catch (error) {
        document.getElementById('tilesContainer').innerHTML = '<div class="loading" style="color: #dc2626;">⚠️ Failed to decrypt content. Please <a href="index.html" style="color: #005ac2;">return to home</a> and try again.</div>';
      }
    }

    // Run decryption when page loads
    window.addEventListener('DOMContentLoaded', decryptContent);

    // Menu functionality
    const menuBtn = document.getElementById('menuBtn');
    const sideMenu = document.getElementById('sideMenu');
    const closeMenu = document.getElementById('closeMenu');
    const overlay = document.getElementById('overlay');
    
    menuBtn.onclick = function() {
      sideMenu.classList.add('open');
      overlay.classList.add('open');
    };
    closeMenu.onclick = function() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('open');
    };
    overlay.onclick = function() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('open');
    };
  </script>
