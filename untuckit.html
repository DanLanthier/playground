  <script>
    // Check authentication
    if (sessionStorage.getItem('authenticated') !== 'true') {
      window.location.href = 'index.html';
    }

    // Decrypt and display content
    function decryptContent() {
      try {
        const encryptedData = document.getElementById('encryptedData').textContent.trim();
        const masterKey = sessionStorage.getItem('masterKey');
        
        if (!masterKey) {
          window.location.href = 'index.html';
          return;
        }

        // Decrypt the data
        const decrypted = CryptoJS.AES.decrypt(encryptedData, masterKey).toString(CryptoJS.enc.Utf8);
        
        if (!decrypted) {
          throw new Error('Decryption failed');
        }

        // Insert decrypted content
        document.getElementById('tilesContainer').innerHTML = decrypted;
      } catch (error) {
        document.getElementById('tilesContainer').innerHTML = '<div class="loading" style="color: #dc2626;">⚠️ Failed to decrypt content. Please <a href="index.html" style="color: #005ac2;">return to home</a> and try again.</div>';
      }
    }

    // Run decryption when page loads
    window.addEventListener('DOMContentLoaded', decryptContent);

    // Menu functionality
    const menuBtn = document.getElementById('menuBtn');
    const sideMenu = document.getElementById('sideMenu');
    const closeMenu = document.getElementById('closeMenu');
    const overlay = document.getElementById('overlay');
    
    menuBtn.onclick = function() {
      sideMenu.classList.add('open');
      overlay.classList.add('open');
    };
    closeMenu.onclick = function() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('open');
    };
    overlay.onclick = function() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('open');
    };
